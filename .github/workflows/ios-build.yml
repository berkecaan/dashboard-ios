name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-unsigned:
    name: Unsigned build and IPA
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'
      - name: Install XcodeGen and generate project
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate
          xcodebuild -version
      - name: Build without signing
        run: |
          xcodebuild -project Dashboard.xcodeproj -scheme Dashboard \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
      - name: Validate packaged app icon
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path
          bundle = Path(os.environ['RUNNER_TEMP']) / 'DerivedData/Build/Products/Release-iphoneos/Dashboard.app'
          with (bundle / 'Info.plist').open('rb') as file:
              info = plistlib.load(file)
          primary = info.get('CFBundleIcons', {}).get('CFBundlePrimaryIcon', {})
          assert primary.get('CFBundleIconName') == 'AppIcon', 'App icon metadata is missing'
          assert (bundle / 'Assets.car').stat().st_size > 0, 'Compiled asset catalog is missing'
          print('App icon is included in the built app.')
          PY
      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Dashboard.app"
          test -d "$APP_PATH"
          PACKAGE_DIR="$RUNNER_TEMP/unsigned-ipa"
          mkdir -p "$PACKAGE_DIR/Payload" "$GITHUB_WORKSPACE/build"
          ditto "$APP_PATH" "$PACKAGE_DIR/Payload/Dashboard.app"
          cd "$PACKAGE_DIR"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/build/Dashboard-unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE/build"
          shasum -a 256 Dashboard-unsigned.ipa > Dashboard-unsigned.ipa.sha256
          echo 'Dashboard-unsigned.ipa hazır. iPhone kurulumu için yeniden imzalama gerekir.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Dashboard-unsigned-ipa
          path: |
            build/Dashboard-unsigned.ipa
            build/Dashboard-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unsigned-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

  build-signed:
    name: Signed IPA (optional)
    needs: build-unsigned
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
      CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      SIGN_IDENTITY: ${{ vars.IOS_SIGN_IDENTITY || 'Apple Distribution' }}
      EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'release-testing' }}
    steps:
      - name: Check signing configuration
        id: gate
        run: |
          if [ -n "$CERT_P12_BASE64" ] && [ -n "$PROFILE_BASE64" ] && [ -n "$TEAM_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo 'İmzalama secret değerleri eksik; imzalı IPA atlandı. İmzasız IPA önceki işin artifact bölümünde.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.gate.outputs.enabled == 'true'
        with:
          xcode-version: '26'
      - name: Install XcodeGen and generate project
        if: steps.gate.outputs.enabled == 'true'
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate
      - name: Install certificate and provisioning profile
        if: steps.gate.outputs.enabled == 'true'
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/dashboard-build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
      - name: Archive signed application
        if: steps.gate.outputs.enabled == 'true'
        run: |
          xcodebuild archive -project Dashboard.xcodeproj -scheme Dashboard \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Dashboard.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            2>&1 | tee archive.log
      - name: Export signed IPA
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          options = {
              'method': os.environ['EXPORT_METHOD'],
              'teamID': os.environ['TEAM_ID'],
              'signingStyle': 'manual',
              'signingCertificate': os.environ['SIGN_IDENTITY'],
              'provisioningProfiles': {
                  'com.berkecaan.dashboard': os.environ['PROFILE_NAME'],
              },
          }
          with (Path(os.environ['RUNNER_TEMP']) / 'ExportOptions.plist').open('wb') as file:
              plistlib.dump(options, file)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Dashboard.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            2>&1 | tee export.log
      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: Dashboard-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload signing failure logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: signed-build-log
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Clean up signing files
        if: always() && steps.gate.outputs.enabled == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/dashboard-build.keychain-db" || true
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
